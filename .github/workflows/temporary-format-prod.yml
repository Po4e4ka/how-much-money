name: temporary frontend formatting
on:
  push:
    branches: [fix/prod-deploy-pint-verify]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Format and autofix frontend on the branch
        run: |
          npm ci
          npm run format
          npx eslint . --fix
          npm run format:check
          npx eslint .
          git diff --check
          git diff --stat
      - name: Commit autoformat to the feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources
          if ! git diff --cached --quiet; then
            git commit -m "style: commit Prettier and ESLint baseline fixes"
            git push
          fi
