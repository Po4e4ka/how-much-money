name: temporary production PHP formatting
on:
  push:
    branches: [fix/prod-deploy-pint-verify]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Format current failing PHP files with Pint
        run: |
          ./vendor/bin/pint app/Console/Commands/ResetUserInfoShown.php app/Http/Controllers/Auth/SocialAuthController.php app/Http/Controllers/PeriodController.php app/Http/Controllers/ViewerController.php app/Models/Viewer.php routes/web.php tests/Feature/Auth/SocialAuthenticationTest.php
          git diff --check
          git diff --stat
          git diff -- app/Console/Commands/ResetUserInfoShown.php app/Http/Controllers/Auth/SocialAuthController.php app/Http/Controllers/PeriodController.php app/Http/Controllers/ViewerController.php app/Models/Viewer.php routes/web.php tests/Feature/Auth/SocialAuthenticationTest.php
      - name: Save Pint formatting to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/Console/Commands/ResetUserInfoShown.php app/Http/Controllers/Auth/SocialAuthController.php app/Http/Controllers/PeriodController.php app/Http/Controllers/ViewerController.php app/Models/Viewer.php routes/web.php tests/Feature/Auth/SocialAuthenticationTest.php
          if ! git diff --cached --quiet; then
            git commit -m "style: format baseline PHP with Laravel Pint"
            git push
          fi
