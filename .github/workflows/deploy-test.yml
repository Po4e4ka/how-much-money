name: deploy test

on:
  push:
    branches:
      - test

concurrency:
  group: test-environment
  cancel-in-progress: false

env:
  TEST_IMAGE_REPOSITORY: ghcr.io/po4e4ka/how-much-money-test

jobs:
  build-and-push:
    name: Build and push test image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, intl, zip, pcntl
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Prepare build environment
        run: cp .env.example .env

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate temporary application key
        run: php artisan key:generate

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Remove build-only environment
        run: rm -f .env

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/test-runtime.Dockerfile
          push: true
          tags: |
            ${{ env.TEST_IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.TEST_IMAGE_REPOSITORY }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy test environment
    needs: build-and-push
    runs-on:
      - self-hosted
      - linux
      - how-much-money
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    environment:
      name: test
      url: https://test.how-much-money.ru
    env:
      HMM_TEST_IMAGE: ghcr.io/po4e4ka/how-much-money-test:${{ github.sha }}
      PROD_DB_PATH: ${{ vars.PROD_DB_PATH }}
      PROD_ENV_PATH: ${{ vars.PROD_ENV_PATH }}
      TEST_DEPLOY_DIR: ${{ vars.TEST_DEPLOY_DIR }}
      TEST_BASIC_AUTH: ${{ secrets.TEST_BASIC_AUTH }}
      TEST_HEALTHCHECK_AUTH: ${{ secrets.TEST_HEALTHCHECK_AUTH }}

    steps:
      - name: Checkout deployment files
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            docker-compose-test.yaml
            containers/scripts/deploy-test.sh
          sparse-checkout-cone-mode: false

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify runner dependencies
        run: |
          set -euo pipefail
          docker version
          docker compose version
          curl --version | head -n 1
          python3 --version

      - name: Deploy test image
        run: bash containers/scripts/deploy-test.sh
