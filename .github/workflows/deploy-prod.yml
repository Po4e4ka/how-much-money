name: deploy production (manual bootstrap)
on:
  workflow_dispatch:
  pull_request:
    branches: [master]
concurrency:
  # PR verification must not occupy the production deployment lock.
  group: production-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
env:
  PROD_IMAGE_REPOSITORY: ghcr.io/po4e4ka/how-much-money-prod
jobs:
  verify:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, intl, zip, pcntl
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan key:generate
          npm ci
      - name: PHPUnit
        run: ./vendor/bin/phpunit
      - name: Check PHP formatting (Pint)
        run: composer run test:lint
      - name: Check frontend ESLint
        run: npx eslint .
      - name: Validate deployment script and Docker Compose
        run: |
          bash -n containers/scripts/deploy-prod.sh
          HMM_PROD_IMAGE=ghcr.io/po4e4ka/how-much-money-prod:0000000000000000000000000000000000000000 PROD_ROOT=/tmp/hmm-prod docker compose -f docker-compose-prod.yaml config --quiet
  build-and-push:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, intl, zip, pcntl
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: |
          cp .env.example .env
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php artisan key:generate
          npm ci
          npm run build
          rm -f .env
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/prod-runtime.Dockerfile
          push: true
          tags: ${{ env.PROD_IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: build-and-push
    runs-on: [self-hosted, linux, how-much-money]
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: https://how-much-money.ru
    env:
      HMM_PROD_IMAGE: ghcr.io/po4e4ka/how-much-money-prod:${{ github.sha }}
      PROD_DB_PATH: ${{ vars.PROD_DB_PATH }}
      PROD_ENV_PATH: ${{ vars.PROD_ENV_PATH }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            docker-compose-prod.yaml
            containers/scripts/deploy-prod.sh
          sparse-checkout-cone-mode: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: bash containers/scripts/deploy-prod.sh
